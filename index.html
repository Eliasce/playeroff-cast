<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PlayerOFF Receptor Web</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;background:#000;color:#eee;font-family:system-ui,Arial,sans-serif;overflow:hidden}
.view{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:2vh 2vw}
.view.on{display:flex}
button{background:#1e1e1e;color:#fff;border:2px solid #444;border-radius:10px;font-size:max(18px,2.2vh);padding:1.4vh 3vh;cursor:pointer}
button:focus,button:hover{border-color:#fff;outline:none;background:#333}
#act h1{font-size:5vh;margin-bottom:4vh}
#pair h2{font-size:3vh;font-weight:400;color:#aaa;margin-bottom:2vh}
#code{font-size:14vh;font-weight:700;letter-spacing:.15em;font-family:monospace;margin:1vh 0 3vh;padding-left:.15em}
#qrbox{background:#fff;padding:12px;border-radius:8px;min-width:100px;min-height:100px;display:flex;align-items:center;justify-content:center;color:#333;font-size:2vh}
#qrbox:empty{display:none}
#qrnote{margin-top:1.5vh;color:#c90;font-size:2vh;min-height:2.5vh}
#pair .row{display:flex;gap:4vw;align-items:center;justify-content:center;flex-wrap:wrap}
#newcode{margin-top:3vh}
#player{background:#000;display:none}
#player.on{display:block}
video{width:100vw;height:100vh;background:#000;object-fit:contain;display:block}
#err{background:rgba(0,0,0,.92);z-index:5}
#err p{font-size:3vh;max-width:80vw;line-height:1.4;margin-bottom:3vh}
#sound{position:fixed;left:50%;bottom:8vh;transform:translateX(-50%);z-index:6;display:none}
#sound.on{display:block}
#status{position:fixed;left:1vw;bottom:1vh;font-size:max(12px,1.6vh);color:#888;z-index:9;display:flex;gap:.6em;align-items:center;pointer-events:none}
#dot{width:1.2vh;height:1.2vh;border-radius:50%;background:#a33;display:inline-block}
#dot.ok{background:#3a3}#dot.wait{background:#da3}
</style>
</head>
<body>

<div id="act" class="view on">
  <h1>PlayerOFF · Receptor Web</h1>
  <button id="actbtn" autofocus>Activar Receptor</button>
</div>

<div id="pair" class="view">
  <h2>Abrí PlayerOFF, elegí "Transmitir" y escaneá el QR o ingresá el código</h2>
  <div class="row">
    <div id="code">······</div>
    <div><div id="qrbox"></div><div id="qrnote"></div></div>
  </div>
  <button id="newcode">Nuevo código</button>
</div>

<div id="player"><video id="v" playsinline></video></div>
<button id="sound">Tocar / Presionar OK para reproducir con audio</button>

<div id="err" class="view">
  <p id="errmsg"></p>
  <button id="errbtn">Volver al código / QR (Esc)</button>
</div>

<div id="status"><span id="dot"></span><span id="stxt">inactivo</span></div>

<script>
(()=>{
"use strict";
const BASE="https://beta.playeroff.app";
const $=id=>document.getElementById(id);
const v=$("v");
const CDN={
  qr:"https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js",
  hls:"https://cdn.jsdelivr.net/npm/hls.js@1/dist/hls.min.js",
  shaka:"https://cdn.jsdelivr.net/npm/shaka-player@4/dist/shaka-player.compiled.js"
};
let rx=null;            // {id,secret,code}
let es=null, esTimer=null, esBackoff=1000;
let hbTimer=null, stTimer=null;
let hls=null, shk=null, blobs=[], playId=0, mode="pair", activated=false;
let lastEvt="—", conn="inactivo";

/* ---------- util ---------- */
const scripts={};
function loadScript(u){
  return scripts[u]||(scripts[u]=new Promise((res,rej)=>{
    const s=document.createElement("script");s.src=u;s.async=true;
    s.onload=()=>res();s.onerror=()=>{delete scripts[u];rej(new Error("CDN"))};
    document.head.appendChild(s);
  }));
}
function setStatus(c,cls){
  conn=c;$("dot").className=cls||"";
  $("stxt").textContent=c+" · evt: "+lastEvt;
}
function show(m){
  mode=m;
  $("act").classList.toggle("on",m==="act");
  $("pair").classList.toggle("on",m==="pair");
  $("player").classList.toggle("on",m==="play");
  $("err").classList.toggle("on",m==="err");
  if(m!=="play")$("sound").classList.remove("on");
  const f={act:"actbtn",pair:"newcode",err:"errbtn"}[m];if(f)$(f).focus();
}
const hdr=(extra)=>Object.assign({"X-Receiver-Secret":rx&&rx.secret},extra||{});
const pick=(o,...k)=>{for(const x of k)if(o&&o[x]!==undefined&&o[x]!==null)return o[x]};
const num=x=>{const n=parseFloat(x);return isNaN(n)?undefined:n};

/* ---------- registro ---------- */
async function register(){
  stopAll(true);
  rx=null;$("code").textContent="······";$("qrbox").innerHTML="";$("qrnote").textContent="";
  show("pair");setStatus("registrando…","wait");
  try{
    const r=await fetch(BASE+"/v1/receivers",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:"Receptor Web",platform:"web"})});
    if(!r.ok)throw new Error("HTTP "+r.status);
    const j=await r.json();
    const o=j.receiver||j.data||j.result||j;
    const id=pick(o,"id","receiverId")??pick(j,"id","receiverId");
    const secret=pick(o,"receiverSecret","secret")??pick(j,"receiverSecret","secret");
    const code=pick(o,"code","pairingCode")??pick(j,"code","pairingCode");
    if(!id||!secret||!code)throw new Error("respuesta inválida");
    rx={id,secret,code:String(code).toUpperCase()};
    $("code").textContent=rx.code;
    drawQR(rx.code);
    setStatus("registrado","ok");
    startHeartbeat();
    connectSSE();
  }catch(e){
    setStatus("error registro: "+e.message+" (reintento 10s)");
    clearTimeout(register.t);register.t=setTimeout(()=>{if(mode==="pair"&&!rx)register()},10000);
  }
}
async function drawQR(code){
  const box=$("qrbox"),note=$("qrnote");
  box.innerHTML="";note.textContent="";
  try{
    await loadScript(CDN.qr);
    new QRCode(box,{text:"playeroff://connect?code="+code,width:240,height:240,colorDark:"#000000",colorLight:"#ffffff",correctLevel:QRCode.CorrectLevel.M});
  }catch(e){
    box.innerHTML="";
    note.textContent="QR no disponible (sin acceso al CDN). Ingresá el código manualmente en la app.";
  }
}

/* ---------- heartbeat ---------- */
function startHeartbeat(){
  clearInterval(hbTimer);
  hbTimer=setInterval(async()=>{
    if(!rx)return;
    try{
      const r=await fetch(BASE+"/v1/receivers/"+rx.id+"/state",{headers:hdr()});
      if(r.status===401||r.status===403||r.status===404||r.status===410){setStatus("sesión caducada");register();}
    }catch(e){}
  },40000);
}

/* ---------- SSE ---------- */
async function connectSSE(){
  closeSSE();
  if(!rx)return;
  const my=rx.id;
  try{
    const r=await fetch(BASE+"/v1/receivers/"+rx.id+"/events-ticket",{method:"POST",headers:hdr()});
    if(r.status===401||r.status===403||r.status===404||r.status===410){register();return}
    if(!r.ok)throw new Error("ticket "+r.status);
    const j=await r.json();
    const t=pick(j,"ticket")??pick(j.data||{},"ticket");
    if(!t)throw new Error("sin ticket");
    if(!rx||rx.id!==my)return;
    es=new EventSource(BASE+"/v1/receivers/"+rx.id+"/events?ticket="+encodeURIComponent(t));
    es.onopen=()=>{esBackoff=1000;setStatus("conectado (SSE)","ok")};
    es.onerror=()=>{closeSSE();setStatus("SSE caído, reconectando…","wait");scheduleSSE()};
    es.onmessage=e=>handle("message",e.data);
    ["cast","command","load","media","play","pause","stop","seek","skip","seekBy","volume","mute"].forEach(n=>es.addEventListener(n,e=>handle(n,e.data)));
  }catch(e){
    setStatus("SSE error: "+e.message,"wait");scheduleSSE();
  }
}
function scheduleSSE(){
  clearTimeout(esTimer);
  esTimer=setTimeout(connectSSE,esBackoff);
  esBackoff=Math.min(esBackoff*2,30000);
}
function closeSSE(){clearTimeout(esTimer);if(es){es.onerror=es.onmessage=es.onopen=null;es.close();es=null}}

function handle(evt,raw){
  let d=raw;try{d=JSON.parse(raw)}catch(e){}
  if(d&&typeof d==="object"&&d.payload&&typeof d.payload==="object")d=Object.assign({type:d.type,event:d.event},d.payload);
  else if(d&&typeof d==="object"&&d.data&&typeof d.data==="object")d=Object.assign({type:d.type,event:d.event},d.data);
  let kind=evt;
  if(evt==="message"&&d&&typeof d==="object")kind=d.event||d.type||"message";
  lastEvt=kind;setStatus(conn,$("dot").className);
  if(kind==="cast"||kind==="load"||kind==="media"){
    if(d&&d.media&&typeof d.media==="object")d=Object.assign({},d,d.media);
    if(d&&d.url)return cast(d);
  }
  if(kind==="command"||["play","pause","stop","seek","skip","seekBy","volume","mute"].includes(kind)){
    const name=kind==="command"?(d.command||d.action||d.name||d.cmd||(d.type!=="command"?d.type:"")):kind;
    return command(String(name||"").toLowerCase(),d||{});
  }
  if(d&&d.url&&kind!=="ping")return cast(d);
}

/* ---------- comandos ---------- */
function command(n,d){
  if(mode!=="play"&&n!=="stop")return;
  const val=pick(d,"value","position","seconds","time","delta","amount","volume","level","muted");
  switch(n){
    case "play":case "resume":v.play().catch(()=>{});break;
    case "pause":v.pause();break;
    case "stop":stopPlayback();break;
    case "seek":{const s=num(val);if(s!==undefined)v.currentTime=Math.max(0,s);break}
    case "skip":case "seekby":case "seekBy".toLowerCase():{const s=num(val);if(s!==undefined)v.currentTime=Math.max(0,v.currentTime+s);break}
    case "volume":{let s=num(val);if(s!==undefined){if(s>1)s/=100;v.volume=Math.min(1,Math.max(0,s));if(v.volume>0)v.muted=false}break}
    case "mute":{if(typeof val==="boolean")v.muted=val;else if(val==="true"||val==="false")v.muted=val==="true";else v.muted=!v.muted;break}
  }
  reportState();
}

/* ---------- reproducción ---------- */
function kindOf(url,type){
  const t=(type||"").toLowerCase(),p=url.split(/[?#]/)[0].toLowerCase();
  if(t.includes("hls")||t.includes("mpegurl")||p.endsWith(".m3u8"))return "hls";
  if(t.includes("dash")||t.includes("mpd")||p.endsWith(".mpd"))return "dash";
  return "direct";
}
function extOf(url){const m=url.split(/[?#]/)[0].match(/\.([a-z0-9]{2,5})$/i);return m?m[1].toLowerCase():"desconocido"}

async function cast(d){
  const id=++playId;
  teardown();
  const url=String(d.url),title=d.title||"";
  const hd=(d.headers&&typeof d.headers==="object")?d.headers:null;
  const pos=num(pick(d,"position","startPosition","startTime"))||0;
  show("play");
  v.muted=false;
  v.dataset.pos=pos;v.dataset.title=title;
  const k=kindOf(url,d.type);
  try{
    if(k==="hls")await playHls(url,hd,pos,id);
    else if(k==="dash")await playDash(url,hd,pos,id);
    else v.src=url;
  }catch(e){
    if(id!==playId)return;
    // fallback a directo
    if(k!=="direct"){try{v.src=url}catch(_){}}
    else return fail("No se pudo iniciar la reproducción: "+e.message);
  }
  if(id!==playId)return;
  addSubs(d.subtitles||d.subtitle||d.tracks,id);
  tryPlay();
  reportState();
}
async function playHls(url,hd,pos,id){
  let ok=false;
  try{await loadScript(CDN.hls);ok=window.Hls&&Hls.isSupported()}catch(e){}
  if(id!==playId)return;
  if(ok){
    hls=new Hls(Object.assign({startPosition:pos>0?pos:-1},hd?{xhrSetup:x=>{for(const k in hd)try{x.setRequestHeader(k,hd[k])}catch(e){}}}:{}));
    hls.on(Hls.Events.ERROR,(_,e)=>{
      if(!e.fatal)return;
      if(e.type===Hls.ErrorTypes.NETWORK_ERROR)hls.startLoad();
      else if(e.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();
      else fail("Error HLS fatal: "+e.details);
    });
    hls.loadSource(url);hls.attachMedia(v);
  }else if(v.canPlayType("application/vnd.apple.mpegurl")){
    v.src=url;
  }else throw new Error("HLS no soportado en este navegador");
}
async function playDash(url,hd,pos,id){
  try{await loadScript(CDN.shaka)}catch(e){throw new Error("shaka-player no disponible (CDN)")}
  if(id!==playId)return;
  shaka.polyfill.installAll();
  if(!shaka.Player.isBrowserSupported())throw new Error("DASH no soportado");
  shk=new shaka.Player();await shk.attach(v);
  if(hd)shk.getNetworkingEngine().registerRequestFilter((t,r)=>{Object.assign(r.headers,hd)});
  shk.addEventListener("error",e=>fail("Error DASH: "+(e.detail&&e.detail.code)));
  await shk.load(url,pos>0?pos:null);
}
function tryPlay(){
  const p=v.play();
  if(p&&p.catch)p.catch(()=>{if(mode==="play"){$("sound").classList.add("on");$("sound").focus()}});
}
$("sound").onclick=()=>{v.muted=false;$("sound").classList.remove("on");v.play().catch(()=>{})};

/* subtítulos */
function srt2vtt(t){return "WEBVTT\n\n"+t.replace(/\r/g,"").replace(/(\d+:\d+:\d+),(\d+)/g,"$1.$2")}
async function addSubs(s,id){
  if(!s)return;
  const list=(Array.isArray(s)?s:[s]).map(x=>typeof x==="string"?{url:x}:x).filter(x=>x&&(x.url||x.src));
  let first=true;
  for(const x of list){
    const u=x.url||x.src;
    let src=u;
    try{
      const r=await fetch(u);if(!r.ok)throw 0;
      let t=await r.text();
      if(!/^\s*WEBVTT/.test(t))t=srt2vtt(t);
      src=URL.createObjectURL(new Blob([t],{type:"text/vtt"}));blobs.push(src);
    }catch(e){}
    if(id!==playId)return;
    const tr=document.createElement("track");
    tr.kind="subtitles";tr.src=src;
    tr.label=x.label||x.name||x.language||x.lang||"Sub";
    tr.srclang=x.language||x.lang||"es";
    if(first){tr.default=true;first=false}
    v.appendChild(tr);
  }
}

/* errores */
v.addEventListener("error",()=>{
  if(!v.getAttribute("src")&&!hls&&!shk)return;
  const e=v.error;if(!e)return;
  const src=v.getAttribute("src")||"";
  const ext=extOf(src||v.currentSrc||"");
  const msg={1:"Reproducción abortada",2:"Error de red al cargar el medio",3:"Error de decodificación (códec no soportado o archivo dañado)",4:"Formato o códec no soportado por este navegador"}[e.code]||"Error de reproducción";
  fail(msg+" — formato: ."+ext+(e.message?" ("+e.message+")":"")+". Los contenedores MKV/AVI/FLV/TS y códecs como HEVC/AC3 dependen del navegador/TV.");
});
function fail(m){
  teardown();
  $("errmsg").textContent=m;
  show("err");reportState("idle");
}

/* ---------- teardown / stop ---------- */
function teardown(){
  if(hls){try{hls.destroy()}catch(e){}hls=null}
  if(shk){try{shk.destroy()}catch(e){}shk=null}
  v.pause();
  while(v.firstChild)v.removeChild(v.firstChild);
  v.removeAttribute("src");try{v.load()}catch(e){}
  blobs.forEach(u=>URL.revokeObjectURL(u));blobs=[];
  $("sound").classList.remove("on");
}
function stopPlayback(){
  playId++;teardown();
  show(rx?"pair":"act");
  reportState("idle");
  if(!rx&&activated)register();
}
function stopAll(keepActivated){
  playId++;teardown();closeSSE();clearInterval(hbTimer);
}

/* ---------- reporte de estado ---------- */
let busy=false;
async function reportState(force){
  if(!rx||busy)return;
  const st=force||(mode!=="play"?"idle":(v.paused?"paused":"playing"));
  busy=true;
  try{
    await fetch(BASE+"/v1/receivers/"+rx.id+"/state",{method:"PUT",headers:hdr({"Content-Type":"application/json"}),
      body:JSON.stringify({state:st,status:st,currentTime:st==="idle"?0:+(v.currentTime||0).toFixed(1),duration:isFinite(v.duration)?+v.duration.toFixed(1):0,volume:Math.round(v.volume*100),muted:v.muted,title:v.dataset.title||undefined})});
  }catch(e){}
  busy=false;
}
stTimer=setInterval(()=>{if(mode==="play")reportState()},5000);
["play","pause","ended","seeked"].forEach(e=>v.addEventListener(e,()=>reportState()));
v.addEventListener("ended",()=>stopPlayback());
v.addEventListener("loadedmetadata",()=>{
  const p=num(v.dataset.pos);
  if(p>0&&!hls&&!shk)try{v.currentTime=p}catch(e){}
});
v.addEventListener("playing",()=>$("sound").classList.remove("on"));

/* ---------- UI / teclado ---------- */
$("actbtn").onclick=()=>{activated=true;register()};
$("newcode").onclick=()=>register();
$("errbtn").onclick=()=>{show(rx?"pair":"act");if(!rx)register()};

document.addEventListener("keydown",e=>{
  const k=e.key,c=e.keyCode;
  if(mode==="play"){
    if(k==="Enter"||k===" "||c===13||c===415||c===19||c===10252){
      if($("sound").classList.contains("on")){$("sound").click()}
      else v.paused?v.play().catch(()=>{}):v.pause();
      e.preventDefault();
    }else if(k==="ArrowLeft"||c===412){v.currentTime=Math.max(0,v.currentTime-10);e.preventDefault()}
    else if(k==="ArrowRight"||c===417){v.currentTime+=10;e.preventDefault()}
    else if(k==="Escape"||k==="Backspace"||c===413||c===10009||c===461){stopPlayback();e.preventDefault()}
  }else if(mode==="err"){
    if(k==="Escape"||k==="Backspace"||c===10009||c===461){$("errbtn").click();e.preventDefault()}
  }else if(mode==="pair"){
    if((k==="Escape"||k==="Backspace")&&false)e.preventDefault();
  }
});
window.addEventListener("online",()=>{if(rx&&!es)connectSSE()});
show("act");setStatus("inactivo");
})();
</script>
</body>
</html>
